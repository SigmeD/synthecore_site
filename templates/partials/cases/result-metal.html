<div class="metal-result-banner sc-case-reveal" aria-label="Результат разработки калькулятора">
  <div class="metal-result-banner__content">
    <h2 id="resultTitle">Результат</h2>
    <div class="metal-result-banner__metric" aria-label="{{metric_aria}}">
      <strong class="metal-result-banner__value">{{metric_value}}</strong>
      <span class="metal-result-banner__label">{{metric_label}}</span>
    </div>
    <p class="metal-result-banner__description">{{result}}</p>
  </div>
  <img aria-hidden="true" alt="" class="metal-result-banner__art" decoding="async" loading="lazy" src="{{metric_art}}" width="660" height="728">
</div>
